<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Điều phối">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme:dark)">
<link rel="icon" href="data:,">
<title>Điều phối</title>
<style>
:root{--bg:#f4f1ea;--ink:#23211d;--mute:#6f6a60;--card:#fffdf8;--line:#ddd6c7;--work:#2f8a63;--ready:#356fa6;--ask:#c2452f;--wait:#b7791f;--sleep:#98a0ae}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--ink:#ecebe7;--mute:#9a9890;--card:#212329;--line:#353840;--work:#5fbf93;--ready:#7fb2e5;--ask:#ef7f6a;--wait:#e0a94a;--sleep:#6f7888}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.42 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0;flex:1}
#live{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
#live i{width:9px;height:9px;border-radius:50%;background:var(--sleep)}
#live.on i{background:var(--work);box-shadow:0 0 0 3px color-mix(in srgb,var(--work) 25%,transparent)}
#live.off i{background:var(--ask)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--mute)}
.sum b{display:block;font-size:20px;color:var(--ink)}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:18px 2px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:block;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
summary{list-style:none;display:flex;align-items:center;gap:9px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.dot{flex:none;width:12px;height:12px;border-radius:4px;background:var(--sleep)}
.work>summary .dot,.dot.work{background:var(--work)}.ready>summary .dot,.dot.ready{background:var(--ready)}
.ask>summary .dot,.dot.ask{background:var(--ask)}.wait>summary .dot,.dot.wait{background:var(--wait)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;font-size:11.5px;border:1px solid var(--line);border-radius:9px;padding:1px 7px;color:var(--mute)}
.chip.ask{color:var(--ask);border-color:var(--ask)}
.more{margin:8px 0 2px 21px;font-size:13.5px}
.more p{margin:6px 0 2px;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.more ul{margin:0;padding-left:16px}.more li{margin:3px 0}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar span{display:block;height:100%;background:var(--work)}
.q{padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.q:first-child{border-top:0}
.q small{display:block;color:var(--ask);font-weight:650;font-size:12px;margin-bottom:2px}
.empty{padding:12px;color:var(--mute);font-size:13.5px}
footer{margin-top:18px;font-size:12.5px;color:var(--mute);text-align:center}
a{color:var(--ready)}
</style>
</head>
<body>
<header><h1>Điều phối</h1><span id="live"><i></i><span id="when">Đang nối…</span></span></header>
<main id="main"></main>
<footer><a href="index.html?3d=1">Xem diorama 3D</a></footer>
<script>
const E = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const stateOf = p => (p.questions || []).length ? 'ask' : (p.working || []).length || p.sessions ? 'work' : (p.ready || []).length ? 'ready' : p.waiting ? 'wait' : 'sleep';
const stored = p => p.kind === 'archive' || p.kind === 'tool' || (p.total > 0 && !(p.working || []).length && !(p.ready || []).length && !p.waiting && !(p.questions || []).length);
const open = new Set();                                    // rows the reader opened stay open across updates
function ul(title, rows) { if (!rows.length) return []; const u = E('ul'); rows.forEach(r => u.append(E('li', '', r))); return [E('p', '', title), u]; }
function head(p, byId) {
  const d = E('details', 'row ' + stateOf(p)); d.open = open.has(p.id);
  d.ontoggle = () => d.open ? open.add(p.id) : open.delete(p.id);
  const s = E('summary'); s.append(E('span', 'dot'));
  const nm = E('span', 'nm'); nm.append(E('b', '', '@' + p.id));
  const w = (p.working || [])[0], r = (p.ready || [])[0];
  nm.append(E('small', '', p.error ? (p.error === 'no plan' ? 'Chưa có orchestra' : p.error) : w ? 'Đang làm ' + w.id + ': ' + w.title : r ? 'Kế tiếp ' + r.id + ': ' + r.title : p.waiting ? p.waiting + ' mục bị chặn' : 'Không có việc mở'));
  s.append(nm);
  if ((p.questions || []).length) s.append(E('span', 'chip ask', p.questions.length + ' ?'));
  if (p.mail) s.append(E('span', 'chip', '✉ ' + p.mail));
  d.append(s);
  const m = E('div', 'more'); m.append(E('div', '', p.name + (p.parent && byId[p.parent] ? ' · thuộc @' + p.parent : '')));
  if (p.total) { const c = p.counts || {}, done = (c.done || 0) + (c.dropped || 0), b = E('div', 'bar'), sp = E('span'); sp.style.width = Math.round(100 * done / p.total) + '%'; b.append(sp);
    m.append(b, E('div', '', done + '/' + p.total + ' mục xong · kế hoạch sửa ' + p.updated)); }
  m.append(...ul('Đang làm', (p.working || []).map(i => i.id + ': ' + i.title)), ...ul('Kế tiếp', (p.ready || []).map(i => i.id + ': ' + i.title)),
    ...ul('Câu hỏi chờ anh', (p.questions || []).map(q => q.id + ': ' + q.text)), ...ul('Việc của người', (p.person || []).map(i => i.id + ' (' + i.owner + '): ' + i.title)));
  d.append(m); return d; }
function draw(s) {
  const m = document.getElementById('main'), y = scrollY; m.textContent = '';
  const byId = Object.fromEntries(s.projects.map(p => [p.id, p])), heads = s.projects.filter(p => !stored(p)), kho = s.projects.filter(stored);
  const working = heads.flatMap(p => [...(p.working || []).map(i => ({p, i})), ...Array(Math.max(0, (p.sessions || 0) - (p.working || []).length)).fill({p, i:{id:'phiên', title:'Phiên Claude Code đang mở'}})]);
  const sum = E('div', 'sum');
  [[s.inbox.questions + s.inbox.person, 'chờ anh'], [working.length, 'đang làm'], [heads.length, 'orchestra'], [kho.length, 'trong kho']].forEach(([n, t]) => { const d = E('div'); d.append(E('b', '', n), document.createTextNode(t)); sum.append(d); });
  m.append(sum);
  m.append(E('h2', '', 'Chờ anh quyết')); const qc = E('div', 'card'); let nq = 0;
  s.projects.forEach(p => { (p.questions || []).forEach(q => { nq++; const d = E('div', 'q'); d.append(E('small', '', '@' + p.id + ' · ' + q.id), document.createTextNode(q.text)); qc.append(d); });
    (p.person || []).forEach(i => { nq++; const d = E('div', 'q'); d.append(E('small', '', '@' + p.id + ' · ' + i.id + ' · việc của ' + i.owner), document.createTextNode(i.title)); qc.append(d); }); });
  if (!nq) qc.append(E('div', 'empty', 'Không có việc nào chờ.')); m.append(qc);
  m.append(E('h2', '', 'Nhân viên đang làm')); const wc = E('div', 'card');
  working.forEach(({p, i}) => { const d = E('div', 'row'), sm = E('summary'); sm.append(E('span', 'dot work')); const nm = E('span', 'nm'); nm.append(E('b', '', i.id + ' · @' + p.id), E('small', '', i.title)); sm.append(nm); d.append(sm); wc.append(d); });
  if (!working.length) wc.append(E('div', 'empty', 'Chưa có việc nào đang chạy.')); m.append(wc);
  s.groups.forEach(g => { const ps = heads.filter(p => p.group === g.id).sort((a, b) => (a.parent || a.id).localeCompare(b.parent || b.id) || (a.parent ? 1 : 0) - (b.parent ? 1 : 0));
    if (!ps.length) return; m.append(E('h2', '', 'Trưởng phòng · ' + g.name)); const c = E('div', 'card'); ps.forEach(p => c.append(head(p, byId))); m.append(c); });
  if (kho.length) { m.append(E('h2', '', 'Kho')); const c = E('div', 'card'); kho.forEach(p => { const d = E('div', 'row'), sm = E('summary'); sm.append(E('span', 'dot')); const nm = E('span', 'nm');
    nm.append(E('b', '', p.name), E('small', '', {archive:'Bản lưu', tool:'Công cụ'}[p.kind] || 'Đã xong')); sm.append(nm); d.append(sm); c.append(d); }); m.append(c); }
  scrollTo(0, y); }
const live = document.getElementById('live'), when = document.getElementById('when');
function show(s, mode) { if (s.error) { live.className = 'off'; when.textContent = s.error; return; }
  draw(s); live.className = mode === 'live' ? 'on' : ''; when.textContent = (mode === 'live' ? 'Trực tiếp · ' : 'Bản chụp · ') + s.generated.slice(5, 16); }
let got = false, es = null;
function snapshot() { fetch('state.json', {cache:'no-cache'}).then(r => r.json()).then(s => show(s, 'snap')).catch(() => { live.className = 'off'; when.textContent = 'Không nối được với máy'; }); }
function connect() {
  if (!window.EventSource) return snapshot();
  es = new EventSource('api/events');                      // the PC pushes a new state only when a plan changes
  es.onmessage = e => { got = true; show(JSON.parse(e.data), 'live'); };
  es.onerror = () => { if (!got) { es.close(); snapshot(); } else { live.className = 'off'; when.textContent = 'Mất kết nối, đang nối lại…'; } }; }
connect();
document.addEventListener('visibilitychange', () => { if (!document.hidden && es && es.readyState === 2) connect(); });
</script>
</body>
</html>
