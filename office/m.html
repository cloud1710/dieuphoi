<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Điều phối">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Điều phối</title>
<style>
:root{--bg:#f4f1ea;--ink:#23211d;--mute:#6f6a60;--card:#fffdf8;--line:#ddd6c7;--work:#2f8a63;--ready:#356fa6;--ask:#c2452f;--wait:#b7791f;--sleep:#98a0ae}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--ink:#ecebe7;--mute:#9a9890;--card:#212329;--line:#353840;--work:#5fbf93;--ready:#7fb2e5;--ask:#ef7f6a;--wait:#e0a94a;--sleep:#6f7888}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.42 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 12px calc(78px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
#bar{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 5px;font-size:11px;color:var(--mute);min-height:20px}
#bar u{flex-basis:100%;height:0}
#bar span{flex:1;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:1px 5px;white-space:nowrap;overflow:hidden;position:relative;text-align:center}
#bar span i{position:absolute;left:0;bottom:0;height:2.5px;background:var(--work);transition:width .6s}
#bar span.hot{color:var(--ask)}#bar span.hot i{background:var(--ask)}
#bar b{color:var(--ink);font-weight:650}
h1{font-size:19px;margin:0;flex:1}
#live{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
#live i{width:9px;height:9px;border-radius:50%;background:var(--sleep)}
#live.on i{background:var(--work)}#live.off i{background:var(--ask)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:12px 4px 11px;border-top:2px solid transparent}
nav button.on{color:var(--ink);font-weight:650;border-top-color:var(--ready)}
nav b{color:var(--ask)}
section{display:none}section.on{display:block}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--mute)}
.sum b{display:block;font-size:20px;color:var(--ink)}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:18px 2px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:block;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child,.q:first-child{border-top:0}
summary,.line{list-style:none;display:flex;align-items:center;gap:9px}
summary{cursor:pointer}summary::-webkit-details-marker{display:none}
.dot{flex:none;width:12px;height:12px;border-radius:4px;background:var(--sleep)}
.work>summary .dot,.dot.work,.dot.running{background:var(--work)}.ready>summary .dot,.dot.ready,.dot.recent{background:var(--ready)}
.ask>summary .dot{background:var(--ask)}.wait>summary .dot{background:var(--wait)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;font-size:11.5px;border:1px solid var(--line);border-radius:9px;padding:1px 7px;color:var(--mute);white-space:nowrap}
.chip.ask{color:var(--ask);border-color:var(--ask)}
.more{margin:8px 0 2px 21px;font-size:13.5px}
.more p{margin:6px 0 2px;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.more ul{margin:0;padding-left:16px}.more li{margin:3px 0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar span{display:block;height:100%;background:var(--work)}
.bar.hot span{background:var(--ask)}
.q{padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.q small{display:block;color:var(--ask);font-weight:650;font-size:12px;margin-bottom:2px}
.empty{padding:12px;color:var(--mute);font-size:13.5px}
button.act{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 12px;margin-top:8px}
button.act.go{background:var(--ready);border-color:var(--ready);color:#fff}
button.act.sure{background:var(--ask);border-color:var(--ask);color:#fff}
button:disabled{opacity:.5}
textarea,select,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-top:8px}
textarea{min-height:84px;resize:vertical}
.note{font-size:12.5px;color:var(--mute);margin:8px 2px}
.res{font-size:13px;margin-top:8px;color:var(--work)}.res.bad{color:var(--ask)}
.g{padding:10px 12px;border-top:1px solid var(--line)}.g:first-child{border-top:0}
.g .line b{flex:1;font-size:14px}.g .line span{font-size:13px;color:var(--mute)}
#stage{position:relative;margin:0 -12px;height:52vh;min-height:300px;background:linear-gradient(#e9f0f4,#f4f1ea);border-bottom:1px solid var(--line);overflow:hidden;touch-action:none}
@media (prefers-color-scheme:dark){#stage{background:linear-gradient(#1c2230,#17181b)}}
#stage canvas{width:100%;height:100%;display:block}
#back{position:absolute;left:10px;top:10px;display:none}
#back.on{display:block}
#stats{position:absolute;right:8px;bottom:8px;width:122px;white-space:nowrap;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;font-size:10px;color:var(--mute);box-shadow:0 3px 10px rgba(0,0,0,.12);pointer-events:none}
#stats div{background:var(--bg);border-radius:7px;padding:3px 6px}
#stats b{display:block;font-size:13px;color:var(--ink);line-height:1.15}
#stats .clk{grid-column:1/3;background:none;padding:0 2px}#stats .clk b{font-size:14px;display:inline;margin-right:5px}
#log{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 140px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 9px 6px;font-size:10.5px;line-height:1.4;box-shadow:0 3px 10px rgba(0,0,0,.12);pointer-events:none}
#log h3{margin:0 0 1px;font-size:9px;letter-spacing:.08em;color:var(--mute)}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#log b{font-weight:650}#log i{font-style:normal;color:var(--mute);margin-right:5px}
#stats,#log{transition:opacity .4s}#stage.zoomin #stats,#stage.zoomin #log{opacity:0;pointer-events:none}
#camb{position:absolute;right:8px;top:8px;margin:0;padding:4px 9px;font-size:11.5px;opacity:.92}
#hint{position:absolute;right:8px;top:42px;font-size:11.5px;color:var(--mute);background:var(--card);border-radius:8px;padding:2px 8px;opacity:.9}
.feed .row{padding:8px 12px}.feed .nm b{font-size:13.5px;white-space:normal}.feed .nm small{white-space:normal}
.dot.ask{background:var(--ask)}.dot.wait{background:var(--wait)}.dot.mail{background:#c79a2b}
@media (min-width:820px){#t-office.on{display:grid;grid-template-columns:1fr 360px;gap:0 14px}#stage{margin:0;height:calc(100vh - 150px);border:1px solid var(--line);border-radius:12px}}
#gear{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;font-size:17px;line-height:1;padding:5px 8px}
#chat{margin:10px -4px 2px;padding:0 4px;max-height:calc(100vh - 42vh - 240px);max-height:calc(100dvh - 42vh - 240px);min-height:110px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.msg{max-width:86%;margin:6px 0;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.vinh{margin-left:auto;background:var(--ready);color:#fff;border-bottom-right-radius:4px}
.msg.boss{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg small{display:block;font-size:10.5px;opacity:.65;margin-top:2px}
.msg.typing{color:var(--mute);font-style:italic}
#say{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));z-index:3;display:none;gap:8px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--line)}
#say.on{display:flex}
#say textarea{flex:1;margin:0;min-height:40px;max-height:110px;height:40px;border-radius:20px;padding:9px 14px;resize:none}
#say button{flex:none;margin:0;border:0;border-radius:20px;background:var(--ready);color:#fff;font:inherit;font-weight:650;padding:0 16px}
body.chatting{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
@media (max-width:819px){body.chatting #stage{height:42vh}}
#pair{position:fixed;inset:0;z-index:9;background:var(--bg);padding:calc(40px + env(safe-area-inset-top)) 18px 40px;display:none;overflow-y:auto}
#pair.on{display:block}
a{color:var(--ready)}
</style>
</head>
<body>
<header><h1>Điều phối</h1><span id="live"><i></i><span id="when">Đang nối…</span></span><button id="gear" aria-label="Cài đặt">⚙</button><div id="bar" aria-label="Phần cứng PC"></div></header>
<section id="t-office" class="on"><div id="stage"><canvas id="cv"></canvas><button class="act" id="back">‹ Toàn cảnh</button><button class="act" id="camb" aria-label="Camera"></button><span id="hint">Chạm một bàn để phóng vào</span><div id="stats"></div><div id="log"></div></div><div id="chat"></div><div id="col"></div></section>
<section id="t-work"></section>
<section id="t-hw"><div id="board"></div><div id="hwfold"></div></section>
<form id="say"><textarea id="sayt" rows="1" placeholder="Nhắn tổng quản…" enterkeyhint="send"></textarea><button type="submit">Gửi</button></form>
<nav><button data-t="office" class="on">Văn phòng</button><button data-t="hw">Trình chiếu</button><button data-t="work">Việc <b id="nq"></b></button></nav>
<div id="pair"><h1>Cài đặt kết nối</h1><p class="note" id="pairinfo"></p><p class="note">Nhập mật khẩu kết nối của anh, hoặc mở đường dẫn ghép có đoạn <code>#k=…</code> mà PC ghi ở <code>out/phone-link.txt</code>.</p>
  <input id="key" type="password" placeholder="Mật khẩu kết nối hoặc mã 6 số" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="act go" id="savekey">Kết nối</button> <button class="act" id="forget">Quên máy này</button> <button class="act" id="closepair">Đóng</button><p class="note" style="margin-top:12px">Ghép máy khác cho nhanh: trên máy đã nối, bấm nút dưới để lấy mã 6 số, rồi nhập mã đó vào ô mật khẩu của máy mới.</p><button class="act" id="mkcode">Tạo mã ghép 6 số</button><div class="res" id="code" style="font-size:22px;letter-spacing:.12em;font-weight:700"></div><label class="note" style="display:block;margin-top:8px"><input type="checkbox" id="showkey" style="width:auto;margin:0 6px 0 0">Hiện mật khẩu khi gõ</label><div class="res bad" id="pairerr"></div><p class="note" id="pairlinks"></p></div>
<script src="board.js"></script>
<script>
const E = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const $ = id => document.getElementById(id);
// the key that pairs this phone with the PC: taken once from the link, kept on the phone
let KEY = '';
try { KEY = localStorage.getItem('dp-key') || ''; } catch (e) {}
if (location.hash.startsWith('#k=')) { KEY = decodeURIComponent(location.hash.slice(3)); try { localStorage.setItem('dp-key', KEY); } catch (e) {} history.replaceState(null, '', location.pathname); }
$('gear').onclick = () => { $('pairinfo').textContent = (liveMode ? 'Đang nối trực tiếp với PC tại ' : 'Chưa nối với PC tại ') + location.host + '. App trên màn hình chính của iPhone giữ mật khẩu riêng, nên ghép lại ở đây một lần.'; $('pair').classList.add('on'); };
$('closepair').onclick = () => $('pair').classList.remove('on');
$('showkey').onchange = () => { $('key').type = $('showkey').checked ? 'text' : 'password'; };
$('mkcode').onclick = async () => { const c = $('code'); try { const j = await api('api/paircode'); c.textContent = j.code.slice(0, 3) + ' ' + j.code.slice(3); c.className = 'res'; setTimeout(() => { c.textContent = ''; }, j.minutes * 60000); } catch (e) { c.style.fontSize = ''; c.textContent = 'Máy này chưa nối nên chưa tạo được mã.'; } };
$('forget').onclick = () => { KEY = ''; try { localStorage.removeItem('dp-key'); } catch (e) {} $('key').value = ''; $('pairerr').textContent = 'Đã quên mật khẩu trên thiết bị này.'; connect(); };
$('savekey').onclick = async () => { let v = $('key').value.trim(); if (!v) return; const err = $('pairerr'); err.textContent = 'Đang ghép…';
  if (/^\d{3}\s?\d{3}$/.test(v)) { try { const r = await fetch('api/pair', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:v})}), j = await r.json(); if (!j.key) { err.textContent = 'Không ghép được: ' + (j.error || 'lỗi'); return; } v = j.key; } catch (e) { err.textContent = 'Không tới được PC tại ' + location.host + '. Kiểm tra ZeroTier trên điện thoại rồi thử lại.'; return; } }
  try { const r = await fetch('api/hwlite', {headers:{'X-DP-Key':v}, cache:'no-store'}); if (r.status === 401) { const j = await r.json().catch(() => ({})); err.textContent = j.why === 'locked' ? 'Nhập sai quá 5 lần. Chờ 1 phút rồi thử lại.' : 'Mật khẩu chưa đúng (' + v.length + ' ký tự). Xem lại chữ hoa, chữ thường và ký tự cuối.'; return; } if (!r.ok) throw 0; }
  catch (e) { err.textContent = 'Không tới được PC tại ' + location.host + '. Kiểm tra ZeroTier trên điện thoại rồi thử lại.'; return; }
  KEY = v; let kept = true; try { localStorage.setItem('dp-key', KEY); kept = localStorage.getItem('dp-key') === KEY; } catch (e) { kept = false; }
  $('key').value = ''; err.textContent = kept ? '' : 'Đã ghép, nhưng máy này không cho lưu khoá: lần mở sau phải ghép lại.'; if (kept) $('pair').classList.remove('on'); connect(); };
async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json', 'X-DP-Key':KEY}, body:JSON.stringify(body)} : {headers:{'X-DP-Key':KEY}, cache:'no-store'});
  if (r.status === 401) { $('pair').classList.add('on'); throw new Error('Chưa ghép khoá'); }
  const j = await r.json(); if (j.error) throw new Error(j.error); return j; }

const stateOf = p => (p.questions || []).length ? 'ask' : (p.working || []).length || p.sessions || progs(p.id).length ? 'work' : (p.ready || []).length ? 'ready' : p.waiting ? 'wait' : 'sleep';
const stored = p => p.kind === 'archive' || p.kind === 'tool' || (p.total > 0 && !(p.working || []).length && !(p.ready || []).length && !p.waiting && !(p.questions || []).length);
const open = new Set(); let liveMode = false, busy = false, STATE = null;
function ul(title, rows) { if (!rows.length) return []; const u = E('ul'); rows.forEach(r => u.append(E('li', '', r))); return [E('p', '', title), u]; }
// a button that asks for a second tap before it acts
function twoTap(label, run) { const b = E('button', 'act', label); let armed = 0;
  b.onclick = async () => { if (!armed) { armed = 1; b.classList.add('sure'); b.textContent = 'Bấm lần nữa để xác nhận'; setTimeout(() => { if (armed === 1) { armed = 0; b.classList.remove('sure'); b.textContent = label; } }, 4000); return; }
    armed = 2; b.disabled = true; b.textContent = 'Đang gửi…'; const res = E('div', 'res');
    try { res.textContent = await run(); } catch (e) { res.className = 'res bad'; res.textContent = e.message; }
    b.after(res); b.textContent = label; b.classList.remove('sure'); b.disabled = false; armed = 0; }; return b; }
function head(p, byId) {
  const d = E('details', 'row ' + stateOf(p)); d.open = open.has(p.id); d.ontoggle = () => d.open ? open.add(p.id) : open.delete(p.id);
  const s = E('summary'); s.append(E('span', 'dot')); const nm = E('span', 'nm'); nm.append(E('b', '', '@' + p.id));
  const w = (p.working || [])[0], r = (p.ready || [])[0];
  nm.append(E('small', '', p.error ? (p.error === 'no plan' ? 'Chưa có orchestra' : p.error) : w ? 'Đang làm ' + w.id + ': ' + w.title : r ? 'Kế tiếp ' + r.id + ': ' + r.title : p.waiting ? p.waiting + ' mục bị chặn' : 'Không có việc mở'));
  s.append(nm);
  if ((p.questions || []).length) s.append(E('span', 'chip ask', p.questions.length + ' ?'));
  if (p.mail) s.append(E('span', 'chip', '✉ ' + p.mail));
  d.append(s);
  const m = E('div', 'more'); m.append(E('div', '', p.name + (p.parent && byId[p.parent] ? ' · thuộc @' + p.parent : '')));
  if (p.total) { const c = p.counts || {}, done = (c.done || 0) + (c.dropped || 0), b = E('div', 'bar'), sp = E('span'); sp.style.width = Math.round(100 * done / p.total) + '%'; b.append(sp);
    m.append(b, E('div', '', done + '/' + p.total + ' mục xong · kế hoạch sửa ' + p.updated)); }
  m.append(...ul('Đang làm', (p.working || []).map(i => i.id + ': ' + i.title)), ...ul('Kế tiếp', (p.ready || []).map(i => i.id + ': ' + i.title)),
    ...ul('Câu hỏi chờ anh', (p.questions || []).map(q => q.id + ': ' + q.text)), ...ul('Việc của người', (p.person || []).map(i => i.id + ' (' + i.owner + '): ' + i.title)));
  ((ACT.stuck || {})[p.id] || []).forEach(k => { m.append(E('p', '', 'Phiên ' + k.item + ' kẹt ' + k.mins + ' phút')), m.append(E('div', 'note', 'Phiên đã mở trên PC nhưng chưa chạy: cửa sổ của nó đang chờ ai đó bấm trên màn hình PC. Dừng phiên rồi mở lại, hoặc bấm trực tiếp trên PC.'));
    if (liveMode) m.append(twoTap('Dừng phiên kẹt ' + k.item, async () => { const o = await api('api/stop', {to:p.id, item:k.item}); pollAct(true); return o.result; })); });
  if (liveMode && p.kind === 'plan' && r && !w) m.append(twoTap('Mở phiên ' + r.id + ' trên PC', async () => { const o = await api('api/open', {to:p.id, item:r.id}); return (o.ok ? 'Đã mở. ' : 'Không mở: ') + o.output; }));
  d.append(m); return d; }
function question(p, q) {
  const d = E('div', 'q'); d.append(E('small', '', '@' + p.id + ' · ' + q.id), document.createTextNode(q.text));
  if (!liveMode) return d;
  const b = E('button', 'act', 'Trả lời'); b.style.display = 'block';
  b.onclick = () => { busy = true; const ta = E('textarea'); ta.placeholder = 'Câu trả lời của anh'; const go = E('button', 'act go', 'Gửi câu trả lời'), res = E('div', 'res');
    go.onclick = async () => { if (!ta.value.trim()) return; go.disabled = true;
      try { const o = await api('api/answer', {to:p.id, q:q.id, text:ta.value}); res.textContent = p.kind === 'plan' ? 'Đã ghi câu trả lời vào kế hoạch.' : 'Đã gửi vào hộp thư của project, phiên điều phối của nó sẽ ghi vào kế hoạch: ' + o.result; busy = false; }
      catch (e) { res.className = 'res bad'; res.textContent = e.message; go.disabled = false; } };
    b.replaceWith(ta, go, res); ta.focus(); };

const live = $('live'), when = $('when');
