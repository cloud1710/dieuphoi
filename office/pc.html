<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điều phối · Dashboard</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0d1117;--panel:#151b24;--panel2:#1b2330;--line:#263042;--ink:#e6edf3;--soft:#c2ccd8;--dim:#9aa7b8;--gold:#f0c14b;--teal:#7fd1c7;--blue:#8fb4ff;--green:#3fb950;--red:#f85149;--amber:#d29922}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button svg{vertical-align:-4px}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:40px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.on{background:var(--gold);border-color:var(--gold);color:#16130a;font-weight:600}
button.rec{background:var(--red);border-color:var(--red);color:#fff}
button.sm{min-height:28px;padding:0 9px;border-radius:8px;font-size:12.5px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
a{color:var(--ink);text-decoration:none}a:hover{color:var(--gold)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:0 0 10px;font-weight:600;display:flex;gap:8px;align-items:center}
h2 small{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
header{display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);flex:none}
header h1{font-size:17px;margin:0;color:var(--gold);letter-spacing:.3px}
#tabs{display:flex;flex-wrap:wrap;gap:4px}
#tabs button{border:0;background:transparent;color:var(--soft);font-weight:500}
#tabs button.on{background:var(--gold);color:#16130a;font-weight:600}
#tabs button b{margin-left:6px;padding:1px 7px;border-radius:9px;background:var(--line);color:var(--ink);font-size:12px;font-weight:500}
#tabs button.on b{background:rgba(0,0,0,.18);color:#16130a}
#tabs button.relax{border:1px solid var(--line);color:var(--teal)}
#right{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:12px;color:var(--dim)}
#clock{font-variant-numeric:tabular-nums}
#ceo{display:flex;align-items:center;gap:7px}
#ceo i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
#ceo.busy i{background:var(--amber);animation:pulse 1s infinite}
#ceo.off i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
#body{flex:1;min-height:0;display:flex;gap:14px;padding:14px 20px}
#view{flex:1;min-width:0;overflow:auto;padding-right:4px}
#view::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:8px}#view::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;align-items:start}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.empty{color:var(--dim)}
.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0;padding-bottom:0}
.item .tx{flex:1;min-width:0}
.item .tx a{display:block;font-weight:500}
.item small{color:var(--dim)}
.item.read .tx a{color:var(--dim);font-weight:400}
.item .tag{flex:none;width:86px;font-size:12px;padding-top:2px}
.item .pin{flex:none;min-height:28px;padding:0 8px;border-radius:8px;background:transparent;color:var(--dim);font-size:12px}
.item .pin.on{color:var(--gold);border-color:var(--gold)}
.score{float:right;margin-left:8px;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 6px;font-size:12px}
.proj h3{margin:0 0 5px;font-size:14px;display:flex;gap:8px;align-items:center}
.proj h3 i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--green)}
.proj h3 i.chu-y{background:var(--amber);border-radius:2px}.proj h3 i.loi{background:var(--red);border-radius:0}
.proj p{margin:4px 0;color:var(--soft)}
.proj p.view{border-left:2px solid var(--gold);padding-left:9px;color:var(--ink)}
.proj p.next{color:var(--dim);font-size:12.5px}
.tree div{padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
.tree small{color:var(--dim)}
.tree i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--dim)}
.tree i.chay{background:var(--amber);animation:pulse 1.2s infinite}.tree i.xong{background:var(--green)}.tree i.loi{background:var(--red);border-radius:2px}.tree i.cho{background:var(--blue);border-radius:2px}
.q{cursor:pointer}.q .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.q.open .tx{display:block}
.q b{flex:none;color:var(--gold);font-weight:600;width:96px;overflow:hidden;text-overflow:ellipsis}
h2 button.sm{margin-left:8px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim)}
h2 small+button.sm{margin-left:8px}
#err{display:none;margin:0 0 12px;padding:8px 12px;border:1px solid var(--amber);border-radius:10px;color:var(--amber)}
kbd{border:1px solid var(--line);border-radius:5px;padding:0 5px;font:12px ui-monospace,Consolas,monospace;color:var(--soft)}
#chat{flex:none;width:68px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;transition:width .18s}
body.chat #chat{width:400px}
#rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
#rail button{width:46px;height:46px;min-height:0;padding:0;border-radius:50%;position:relative}
#rail #openchat{background:var(--gold);border-color:var(--gold);color:#16130a;font-weight:700;font-size:12px}
#rail #openchat.new::after{content:"";position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--panel)}
#rail span{writing-mode:vertical-rl;color:var(--dim);font-size:12px;margin-top:6px}
body.chat #rail{display:none}
#drawer{display:none;flex-direction:column;min-height:0;flex:1}
body.chat #drawer{display:flex}
#drawer h2{padding:12px 14px 0;margin:0}
.scroll{overflow:auto;min-height:0;flex:1;padding:8px 14px 12px}
#log{display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;background:var(--panel2);align-self:flex-start}
.msg.vinh{align-self:flex-end;background:#1f3a66}
.msg small{display:block;color:var(--dim);font-size:11px;margin-top:3px}
.msg .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.msg .files a{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;background:var(--bg)}
.msg .files img{max-width:160px;max-height:120px;border-radius:6px;display:block}
#step{color:var(--amber);font-size:12px;padding:0 14px 6px;min-height:20px;flex:none}
#compose{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end;flex:none}
#compose textarea{resize:none;height:42px;max-height:140px}
#compose button{padding:0 10px}
#picked{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px;flex:none}
#picked span{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--dim);cursor:pointer}
#chat.drop{outline:2px dashed var(--blue)}
footer{display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:8px 20px;border-top:1px solid var(--line);background:#11161e;flex:none;position:relative;z-index:6}
#ytwrap{width:96px;height:54px;background:#000;border-radius:6px;overflow:hidden;flex:none;cursor:pointer}
#ytwrap.big{position:fixed;right:20px;bottom:84px;width:480px;height:270px;border:1px solid var(--line);border-radius:10px;z-index:7}
#ytwrap>div,#ytwrap iframe{width:100%;height:100%;border:0}
#nowbox{flex:1;min-width:200px;overflow:hidden}
#now{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now small{color:var(--gold);font-weight:400;margin-right:6px}
#qinfo{color:var(--dim);font-size:12px}
footer label{display:flex;align-items:center;gap:8px;color:var(--dim)}
footer input[type=range]{width:140px;padding:0;accent-color:var(--gold)}
#relax{position:fixed;inset:0;z-index:5;display:none;background:#04202c;color:#eaf6f8}
body.relax #relax{display:block}
body.relax #body,body.relax header{visibility:hidden}
#relax canvas,#relax #rv,#relax iframe.office{position:absolute;inset:0;width:100%;height:100%;border:0}
#rv{pointer-events:none;display:none}
#rv iframe{width:100%;height:100%;border:0;transform:scale(1.18)}
#rtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:16px 20px;transition:opacity .6s}
#rtop button,#rbot button{background:rgba(4,26,38,.55);border-color:rgba(234,246,248,.35);color:#eaf6f8;border-radius:22px}
#rtop button{border-radius:10px}
#rbot button.on{background:var(--teal);border-color:var(--teal);color:#06222e}
#rnote{margin-left:auto;padding:8px 14px;border-radius:10px;background:rgba(4,26,38,.55);display:flex;gap:8px;align-items:center}
#rclock{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;text-shadow:0 2px 24px rgba(4,26,38,.7)}
#rclock b{display:block;font:500 120px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:-2px}
#rclock span{font-size:18px;color:#d3ecef}
#rbot{position:absolute;left:0;right:0;bottom:0;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(4,26,38,0),rgba(4,26,38,.85));transition:opacity .6s}
#rbot .row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
#rbot .row>span{width:70px;color:#d3ecef}
#relax.idle #rbot,#relax.idle #rtop{opacity:0}
#relax.idle{cursor:none}
#set{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#set.show{display:flex}
#set form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(640px,92vw);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#set label{color:var(--dim);font-size:12.5px;margin-top:6px}
#set .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:8px 14px;display:none;z-index:10;max-width:70vw}
@media(max-width:1000px){.two{grid-template-columns:1fr}.cols{grid-template-columns:1fr}body.chat #chat{position:fixed;inset:60px 10px 80px 10px;width:auto;z-index:8}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Điều phối</h1>
  <nav id="tabs"></nav>
  <div id="right">
    <span id="clock"></span>
    <span id="ceo"><i></i><span id="ceot">đang nối…</span></span>
    <button id="hands" title="Rảnh tay: nói &quot;CEO ơi, …&quot; để nhắn; &quot;phát nhạc&quot;, &quot;bài tiếp&quot;, &quot;đọc cập nhật&quot;, &quot;thư giãn&quot; chạy ngay">Rảnh tay</button>
    <button id="tts" title="Đọc to câu trả lời của CEO">Đọc trả lời</button>
    <button id="full" title="Toàn màn hình (F11)" aria-label="Toàn màn hình"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="gear" title="Cài đặt" aria-label="Cài đặt"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
</header>
<div id="body">
  <main id="view"></main>
  <aside id="chat">
    <div id="rail">
      <button id="openchat" title="Mở ô chat với CEO">CEO</button>
      <button id="railmic" title="Nói để nhắn CEO" aria-label="Nói để nhắn CEO"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <span>Bấm để mở chat</span>
    </div>
    <div id="drawer">
      <h2>CEO <small id="model"></small><button class="sm" id="closechat" aria-label="Thu gọn ô chat">Thu gọn</button></h2>
      <div class="scroll" id="logbox"><div id="log"></div></div>
      <div id="step"></div>
      <div id="picked"></div>
      <div id="compose">
        <button id="clip" title="Gửi tệp (hoặc kéo thả vào đây)" aria-label="Gửi tệp"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg></button>
        <input type="file" id="file" multiple hidden>
        <textarea id="text" placeholder="Nhắn CEO… (Enter để gửi)"></textarea>
        <button id="mic" title="Nói để nhắn" aria-label="Nói để nhắn"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button id="send">Gửi</button>
      </div>
    </div>
  </aside>
</div>
<footer>
  <div id="ytwrap" title="Bấm để phóng to hoặc thu nhỏ video"><div id="yt"></div></div>
  <div id="nowbox"><div id="now">Chưa phát</div><div id="qinfo"></div></div>
  <button id="play">Phát</button><button id="next" aria-label="Bài tiếp" title="Bài tiếp"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l9 7-9 7zM18 5v14"/></svg></button>
  <label>Âm lượng <input type="range" id="vol" min="0" max="100" value="45"></label>
</footer>

<div id="relax">
  <canvas id="rc"></canvas>
  <div id="rv"><div id="rvp"></div></div>
  <div id="rclock"><b id="rtime"></b><span id="rdate"></span></div>
  <div id="rtop"><button id="rback">Quay lại dashboard</button><div id="rnote"></div></div>
  <div id="rbot">
    <div class="row" id="rscenes"><span>Cảnh</span></div>
    <div class="row" id="rsounds"><span>Âm nền</span></div>
  </div>
</div>

<div id="set"><form id="setf">
  <b>Cài đặt dashboard</b>
  <label>Playlist YouTube anh hay nghe (dán đường dẫn có list=… hoặc mã playlist; bỏ trống thì dùng danh sách bài đã thích)</label><input id="s-pl">
  <label>Playlist thịnh hành để xen bài mới (bỏ trống thì dùng bảng xếp hạng tự lấy)</label><input id="s-tr">
  <label>Cứ mấy bài của anh thì xen một bài mới (0 = không xen)</label><input id="s-mix" type="number" min="0" max="10">
  <label>Chủ đề tin tức, mỗi dòng: Tên | từ khoá tìm | vi hoặc en</label><textarea id="s-top" rows="5"></textarea>
  <label>Nguồn mạng xã hội công khai (mỗi dòng một đường dẫn nhóm hoặc trang Facebook)</label><textarea id="s-soc" rows="5"></textarea>
  <label><input type="checkbox" id="s-idle" style="width:auto"> Tự chuyển sang Thư giãn sau 5 phút không dùng máy</label>
  <label>Phím tắt: <kbd>1</kbd> đến <kbd>5</kbd> đổi tab · <kbd>R</kbd> thư giãn · <kbd>C</kbd> mở chat · <kbd>/</kbd> nhắn CEO · <kbd>Space</kbd> phát/dừng · <kbd>N</kbd> bài tiếp · <kbd>Esc</kbd> thoát thư giãn</label>
  <div class="row"><button type="button" id="s-x">Đóng</button><button class="on">Lưu</button></div>
</form></div>
<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const E = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const LS = {get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
let KEY = LS.get('dp-key', '');
if (location.hash.startsWith('#k=')) { KEY = decodeURIComponent(location.hash.slice(3)); LS.set('dp-key', KEY); history.replaceState(null, '', location.pathname); }
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {headers: {'X-DP-Key': KEY}} : {method: 'POST', headers: {'X-DP-Key': KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error === 'key' ? 'Chưa ghép: trên PC chạy dashboard.cmd; ở máy khác, mở app điều phối để ghép trước' : (j.error || 'lỗi ' + r.status));
  return j;
};
const toast = t => { const b = $('toast'); b.textContent = t; b.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => b.style.display = 'none', 4500); };
const fold = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
const safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? u : null;
function tick() { const d = new Date(), hm = d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'}), day = d.toLocaleDateString('vi-VN', {weekday: 'long', day: 'numeric', month: 'numeric'});
  $('clock').textContent = day + ' · ' + hm; $('rtime').textContent = hm; $('rdate').textContent = day; }
setInterval(tick, 1000); tick();

/* ---------- data and tabs ---------- */
let DASH = {news: {}, social: {}, hot: {}, projects: {}, cfg: {}}, VIEC = [], STATE = null, TAB = LS.get('dp-tab', 'today');
const TABS = [['today', 'Hôm nay'], ['pro', 'Chuyên môn'], ['tech', 'Công nghệ'], ['proj', 'Dự án'], ['fun', 'Giải trí']];
const TAG = {pro: ['Chuyên môn', 'var(--teal)'], tech: ['Công nghệ', 'var(--blue)'], proj: ['Dự án', 'var(--gold)'], fun: ['Giải trí', 'var(--soft)']};
const tabOf = name => /cập nhật|giải phẫu|y khoa|patholog/i.test(name) ? 'pro' : /chứng khoán/i.test(name) ? 'proj' : /bóng đá|thể thao|giải trí|handheld/i.test(name) ? 'fun' : 'tech';
const topics = () => [].concat((DASH.social || {}).topics || [], DASH.news.topics || []);
const idOf = x => (x.url || '') + '|' + String(x.title).slice(0, 60);
let READ = new Set(JSON.parse(LS.get('dp-read', '[]'))), PINS = JSON.parse(LS.get('dp-pins', '[]'));
function markRead(x) { READ.add(idOf(x)); LS.set('dp-read', JSON.stringify([...READ].slice(-1200))); drawTabs(); }
function togglePin(x) { const i = PINS.findIndex(p => idOf(p) === idOf(x)); if (i >= 0) PINS.splice(i, 1); else PINS.unshift({title: x.title, url: x.url, src: x.src, at: x.at}); PINS = PINS.slice(0, 60); LS.set('dp-pins', JSON.stringify(PINS)); draw(); }
const unread = tab => topics().filter(t => tabOf(t.name) === tab).reduce((n, t) => n + t.items.filter(x => x.url && !READ.has(idOf(x))).length, 0);
function drawTabs() { const box = $('tabs'); box.textContent = '';
  TABS.forEach(([id, name]) => { const b = E('button', id === TAB ? 'on' : '', name), n = id === 'today' ? 0 : unread(id); if (n) b.append(E('b', '', n)); b.onclick = () => { TAB = id; LS.set('dp-tab', id); draw(); }; box.append(b); });
  const r = E('button', 'relax', 'Thư giãn'); r.onclick = () => Relax.open(); box.append(r); }

$('hands').onclick = () => { if (!SR) return toast('Trình duyệt này không nhận giọng nói liên tục; dùng Chrome hoặc Edge'); HANDS = !HANDS; $('hands').classList.toggle('on', HANDS); if (HANDS) { listen('hands'); toast('Đang nghe. Nói "CEO ơi, …" để nhắn; "phát nhạc", "đọc cập nhật", "thư giãn" chạy ngay.'); } else stopListen(); };
let mrec = null;
async function micClick() {
  if (rec && recMode === 'mic') { stopListen(); if (HANDS) listen('hands'); return; }
  if (mrec) { mrec.stop(); return; }
  if (SR && listen('mic')) return;
  try { const st = await navigator.mediaDevices.getUserMedia({audio: true}), parts = []; mrec = new MediaRecorder(st); micUi(true); duck(true);
    mrec.ondataavailable = e => parts.push(e.data);
    mrec.onstop = async () => { st.getTracks().forEach(t => t.stop()); micUi(false); duck(false); const b = new Blob(parts, {type: mrec.mimeType}), ext = /ogg/.test(b.type) ? 'ogg' : /mp4/.test(b.type) ? 'm4a' : 'webm'; mrec = null;
      try { const r = await fetch('api/voice?name=giong-noi.' + ext, {method: 'POST', headers: {'X-DP-Key': KEY, 'Content-Type': 'application/octet-stream'}, body: b}), j = await r.json(); if (!r.ok) throw new Error(j.error); heard(j.text || '', true); } catch (e) { toast('Chưa nhận được giọng nói: ' + e.message); } };
    mrec.start(); } catch (e) { toast('Không mở được micro: ' + e.message); } }
$('mic').onclick = micClick; $('railmic').onclick = micClick;

/* ---------- background music ---------- */
let YTQ = [], YTREADY = false; window.onYouTubeIframeAPIReady = () => { YTREADY = true; YTQ.forEach(f => f()); YTQ = []; };
const whenYT = f => YTREADY ? f() : YTQ.push(f);
{ const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { $('now').textContent = 'Không tải được trình phát YouTube (kiểm tra mạng)'; }; document.head.append(s); }
const P = (() => {
  let yt = null, ready = false, mine = [], trend = [], cur = null, count = 0, wantPlay = false, loadedList = null, volume = +LS.get('dp-vol', 45), ducked = false, bagMine = [], bagTrend = [];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function pickNext() { const mix = +(DASH.cfg.mix ?? 3), takeTrend = trend.length && (!mine.length || (mix > 0 && count > 0 && count % (mix + 1) === mix)); count++;
    if (takeTrend) { if (!bagTrend.length) bagTrend = shuffle(trend); return Object.assign({trend: true}, bagTrend.pop()); }
    if (!mine.length) return null; if (!bagMine.length) bagMine = shuffle(mine); return {id: bagMine.pop()}; }
  const playing = () => !!(ready && cur && yt.getPlayerState() === 1);
  function show() { const d = yt && yt.getVideoData ? yt.getVideoData() : {}, n = $('now'); n.textContent = '';
    $('qinfo').textContent = (mine.length ? mine.length + ' bài của anh' : '') + (trend.length ? (mine.length ? ', xen ' : '') + trend.length + ' bài thịnh hành' : '');
    if (!cur) { n.textContent = mine.length || trend.length ? 'Sẵn sàng phát' : 'Chưa có bài: bấm ⚙ để dán playlist YouTube của anh'; return; }
    if (cur.trend) n.append(E('small', '', 'MỚI ·')); n.append(document.createTextNode((cur.title || d.title || '…') + ((cur.by || d.author) ? ' · ' + (cur.by || d.author) : ''))); }
  function start(item) { cur = item; if (!cur) return show(); yt.loadVideoById(cur.id); yt.setVolume(ducked ? Math.min(volume, 12) : volume); $('play').textContent = 'Dừng'; setTimeout(show, 1500); show(); Relax.mix(); }
  function next() { if (!ready) return; wantPlay = true; start(pickNext()); }
  function loadMine() { const ids = DASH.cfg.mine || [], list = DASH.cfg.playlist || ('ids:' + ids.join(',')); if (!ready || list === loadedList) return; loadedList = list; bagMine = [];
    if (list.startsWith('ids:')) { mine = ids.slice(); if (wantPlay && !cur) next(); } else { mine = []; yt.cuePlaylist({list, listType: 'playlist'}); } }
  function onState(e) { if (e.data === 5 && !mine.length && loadedList && !loadedList.startsWith('ids:')) { mine = (yt.getPlaylist() || []).slice(); show(); if (wantPlay) next(); }
    if (e.data === 0) next(); if (e.data === 1) show(); Relax.mix(); }
  whenYT(() => { yt = new YT.Player('yt', {playerVars: {controls: 1, rel: 0, playsinline: 1}, events: {onReady: () => { ready = true; yt.setVolume(volume); loadMine(); show(); }, onStateChange: onState, onError: () => { if (cur) setTimeout(next, 800); }}}); });
  $('vol').value = volume; $('vol').oninput = e => { volume = +e.target.value; LS.set('dp-vol', volume); if (ready) yt.setVolume(volume); Relax.mix(); };
  $('ytwrap').onclick = () => $('ytwrap').classList.toggle('big');
  const out = {
    feed() { const seen = new Set(); trend = [].concat(DASH.news.trend || [], ((DASH.hot || {}).music || []).filter(x => /^[\w-]{11}$/.test(x.yt || '')).map(x => ({id: x.yt, title: x.title, by: x.by}))).filter(x => !seen.has(x.id) && seen.add(x.id)); bagTrend = []; loadMine(); show(); },
    play() { if (!ready) return; wantPlay = true; if (cur && yt.getPlayerState() === 2) { yt.playVideo(); $('play').textContent = 'Dừng'; } else if (!playing()) next(); },
    pause() { wantPlay = false; if (ready && cur) yt.pauseVideo(); $('play').textContent = 'Phát'; },
    next, playing, playNow(item) { if (ready) { wantPlay = true; start(item); } },
    vol(d) { volume = Math.max(0, Math.min(100, volume + d)); $('vol').value = volume; LS.set('dp-vol', volume); if (ready) yt.setVolume(volume); },
    duck(on) { ducked = on; if (ready) yt.setVolume(on ? Math.min(volume, 12) : volume); },
    state: () => ({mine: mine.length, trend: trend.length, cur, count}) };
  $('play').onclick = () => playing() ? out.pause() : out.play(); $('next').onclick = next;
  return out;
})();
function duck(on) { P.duck(on); }

/* ---------- relax mode: scenes and ambient sound ---------- */
const Relax = (() => {
  const SCENES = [['aq3d', 'Bể cá 3D'], ['aqua', 'Bể cá thật'], ['rain', 'Mưa bên cửa sổ'], ['fire', 'Lửa trại'], ['forest', 'Suối rừng'], ['stars', 'Trời sao'], ['deep', 'Fish Tank Screen (orchidstreet)'], ['office', 'Văn phòng 3D']];
  const FRAMES = {office: 'm.html', deep: 'https://orchidstreet.github.io/fish-tank-screen/'};
  const SOUNDS = [['canh', 'Theo cảnh'], ['nuoc', 'Nước chảy'], ['mua', 'Mưa'], ['song', 'Sóng biển'], ['lua', 'Lửa tí tách'], ['nau', 'Tiếng ồn nâu'], ['tat', 'Tắt']];
  const NATURAL = {aq3d: 'nuoc', aqua: 'nuoc', rain: 'mua', fire: 'lua', forest: 'nuoc', stars: 'nau', office: 'tat', deep: 'nuoc'};
  let mod = null, live = null, vp = null, scene = LS.get('dp-scene', 'aq3d'), sound = LS.get('dp-sound', 'canh'), isOpen = false, idleT = 0, hideT = 0, frame = null;
  const load = async () => mod || (mod = await import('./relax.js'));
  const isVideo = k => ['aqua', 'rain', 'fire', 'forest'].includes(k);
  const has = k => !isVideo(k) || !!(DASH.news.scenes || {})[k];
  function buttons() { [['rscenes', SCENES, () => scene, k => setScene(k)], ['rsounds', SOUNDS, () => sound, k => setSound(k)]].forEach(([id, list, cur, pick]) => { const box = $(id); [...box.querySelectorAll('button')].forEach(b => b.remove());
    list.forEach(([k, name]) => { if (!has(k)) return; const b = E('button', k === cur() ? 'on' : '', name); b.onclick = () => pick(k); box.append(b); }); }); }
  function stopScene() { if (live) { live.stop(); live = null; } if (frame) { frame.remove(); frame = null; } $('rv').style.display = 'none'; if (vp && vp.pauseVideo) vp.pauseVideo(); $('rc').style.display = 'none'; }
  async function setScene(k) { if (!has(k)) k = 'aq3d'; scene = k; LS.set('dp-scene', k); stopScene(); buttons(); if (!isOpen) return;
    if (FRAMES[k]) { frame = E('iframe', 'office'); frame.src = FRAMES[k]; frame.title = k; frame.allow = 'fullscreen'; frame.referrerPolicy = 'no-referrer'; $('relax').insertBefore(frame, $('rclock')); }
    else if (isVideo(k)) { $('rv').style.display = 'block'; const id = DASH.news.scenes[k];
      whenYT(() => { if (vp && vp.loadVideoById) vp.loadVideoById(id); else vp = new YT.Player('rvp', {videoId: id, playerVars: {autoplay: 1, controls: 0, loop: 1, playlist: id, rel: 0, playsinline: 1, mute: 1}, events: {onReady: () => { vp.playVideo(); mix(); }, onStateChange: e => { if (e.data === 0) vp.playVideo(); }}}); mix(); }); }
    else { const m = await load(); if (scene !== k || !isOpen) return; const c = $('rc'), fresh = c.cloneNode(false); c.replaceWith(fresh); fresh.style.display = 'block';   /* a canvas keeps its first context type */
      try { live = k === 'stars' ? m.stars(fresh) : m.aquarium(fresh); } catch (e) { live = m.stars(fresh); toast('Máy này không chạy được cảnh 3D, em chuyển sang trời sao'); } }
    mix(); }
  /* who makes the sound: the scene's own video when "Theo cảnh" and it has one, else the synth; music playing ducks both */
  async function mix() { if (!isOpen) return; const music = P.playing(), k = sound === 'canh' ? NATURAL[scene] : sound, useVideo = sound === 'canh' && isVideo(scene), vol = +LS.get('dp-vol', 45);
    if (vp && vp.mute) { if (useVideo && !music) { vp.unMute(); vp.setVolume(vol); } else vp.mute(); }
    const m = await load(); if (!isOpen) return; const want = useVideo || k === 'tat' ? '' : k; if (m.Ambient.kind() !== want) m.Ambient.play(want); m.Ambient.volume(vol / 100 * 0.8); m.Ambient.duck(music); }
  function setSound(k) { sound = k; LS.set('dp-sound', k); buttons(); mix(); }
  function wake() { $('relax').classList.remove('idle'); clearTimeout(hideT); hideT = setTimeout(() => $('relax').classList.add('idle'), 6000); }
  function note() { const n = questions().length, box = $('rnote'); box.textContent = ''; const i = E('i'); i.style.cssText = 'width:9px;height:9px;border-radius:50%;background:' + ($('ceo').className === 'busy' ? 'var(--amber)' : 'var(--green)'); box.append(i, document.createTextNode($('ceot').textContent + (n ? ' · ' + n + ' việc chờ anh' : ''))); }
  function open() { if (isOpen) return; isOpen = true; $('relax').style.bottom = document.querySelector('footer').offsetHeight + 'px'; document.body.classList.add('relax'); note(); setScene(scene); wake(); }
  function close() { if (!isOpen) return; isOpen = false; document.body.classList.remove('relax'); stopScene(); if (mod) mod.Ambient.stop(); armIdle(); }
  function armIdle() { clearTimeout(idleT); if (LS.get('dp-idle', '1') === '1') idleT = setTimeout(() => { if (!document.hidden && !rec) open(); }, 5 * 60000); }
  ['mousemove', 'keydown', 'pointerdown', 'wheel'].forEach(n => addEventListener(n, () => { if (isOpen) wake(); else armIdle(); }, {passive: true}));
  addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) close(); });
  $('rback').onclick = close; armIdle();
  return {open, close, mix, note, buttons, isOpen: () => isOpen, state: () => ({scene, sound, live: !!live})};
})();

/* ---------- settings ---------- */
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$('gear').onclick = () => { const c = DASH.cfg || {}; $('s-pl').value = c.playlist || ''; $('s-tr').value = c.trending || ''; $('s-mix').value = c.mix ?? 3; $('s-soc').value = (c.social || []).join('\n'); $('s-idle').checked = LS.get('dp-idle', '1') === '1';
  $('s-top').value = (c.topics || []).map(t => [t.name, t.q, t.lang || 'vi'].join(' | ')).join('\n'); $('set').classList.add('show'); };
$('s-x').onclick = () => $('set').classList.remove('show');
$('setf').onsubmit = async e => { e.preventDefault(); LS.set('dp-idle', $('s-idle').checked ? '1' : '0');
  const tp = $('s-top').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p.length >= 2 && p[1]).map(p => ({name: p[0], q: p[1], lang: p[2] === 'en' ? 'en' : 'vi'}));
  try { const r = await api('api/dash', {playlist: $('s-pl').value, trending: $('s-tr').value, mix: +$('s-mix').value, topics: tp, social: $('s-soc').value.split('\n').map(x => x.trim()).filter(Boolean)});
    if ($('s-pl').value.trim() && !r.cfg.playlist) toast('Không đọc được mã playlist: dán đường dẫn có "list=…"'); else toast('Đã lưu; tin và nhạc cập nhật sau khoảng một phút');
    $('set').classList.remove('show'); setTimeout(pollDash, 1500); setTimeout(pollDash, 45000); } catch (x) { toast('Chưa lưu được: ' + x.message); } };

addEventListener('keydown', e => { if (e.ctrlKey || e.altKey || e.metaKey || /INPUT|TEXTAREA/.test((e.target || {}).tagName || '') || $('set').classList.contains('show')) return; const k = e.key.toLowerCase();
  if (k >= '1' && k <= '5' && !Relax.isOpen()) { TAB = TABS[+k - 1][0]; LS.set('dp-tab', TAB); draw(); } else if (k === 'r') Relax.isOpen() ? Relax.close() : Relax.open(); else if (k === 'c') openChat(!document.body.classList.contains('chat'));
  else if (k === ' ') { e.preventDefault(); P.playing() ? P.pause() : P.play(); } else if (k === 'n') P.next(); else if (k === '/') { e.preventDefault(); openChat(true); $('text').focus(); } });
if (LS.get('dp-chat', '0') === '1') openChat(true);
draw(); pollChat(); pollDash();
</script>
